[project]
name = "aseneb"
version = "0.4.0"

dependencies = [
    "ase",
    "numpy",
    "pyyaml",
    "mace-torch",
]

[project.optional-dependencies]
analysis = [
    "pandas",
    "matplotlib",
    "scipy",
    "pymatgen",
    "pillow",
    "vestapy",
]


[project.scripts]
aseneb = "aseneb.cli:main"
aseneb-analyze = "aseneb.analysis_scripts.analysis_cli:main"
aseneb-plot-barriers = "aseneb.analysis_scripts.plot_cli:main"
aseneb-make-summary-plots = "aseneb.analysis_scripts.make_figure_comparison:main"

getenergies = "aseneb.helper_scripts.getenergies:main"
cont2jdft = "aseneb.helper_scripts.cont2jdft:main"
